    <!-- Icons & PWA -->
    <link rel="icon" type="image/png" href="/favicon.png" />

         home-screen tags aren't auto-injected and are added manually. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MonthExpense" />

    <!-- Schema.org JSON-LD Structured Data for Google Search -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "MonthExpense",
        "url": "https://monthexpense.pages.dev/",
        "description": "Offline-first personal expense tracker with receipt scanning, voice entry, and private Google Sheets sync.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Local OCR Receipt Scanning",
          "Voice Expense Input",
          "Google Sheets Cloud Backup",
          "Offline-First Storage",
          "Recurring Expense Schedules",
          "Multi-Wallet Tracking"
        ]
      }
    </script>

    <!-- Google Identity Services — client-side sign-in (id_token) and
         OAuth token client (access_token) for the Google-login sync
         setup. See src/features/sync/google-auth.ts. No SRI hash here on
         purpose: Google serves and updates this script unversioned and
         explicitly documents that pinning its integrity hash breaks it
         on their next update — not an oversight. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

  <body>
    <!-- Fallback content for search engine crawlers and browsers without JavaScript -->
    <noscript>
      <div
        style="
          font-family:
            system-ui,

            &quot;Segoe UI&quot;,
            Roboto,

      >
        <h1>MonthExpense - Offline-First Expense Tracker</h1>
        <p>
          MonthExpense is a privacy-first, offline-first personal expense tracker. Log daily
          spending via on-device AI receipt scanning, voice recognition, or fast manual input, with
          automatic backup to your private Google Sheets spreadsheet.
        </p>
        <h2>Key Features</h2>
        <ul>
          <li>
            <strong>Offline-First:</strong> All expenses and wallets are stored locally on your
            device in IndexedDB/localStorage.
          </li>
          <li>
            <strong>Local OCR Receipt Scanner:</strong> Scan receipts instantly with on-device
            PaddleOCR without sending photos to third parties.
          </li>
          <li>
            <strong>Voice Entry:</strong> Speak your expenses naturally in English or Indonesian.
          </li>
          <li>
            <strong>Private Google Sheets Sync:</strong> Automatic bidirectional sync directly to
            your personal Google Drive spreadsheet.
          </li>
          <li>
            <strong>Multi-Wallet &amp; Analytics:</strong> Track budgets across multiple wallets and
            visualize monthly trends.
          </li>
        </ul>
        <p>Please enable JavaScript in your browser to run the full interactive application.</p>
        <nav style="margin-top: 1.5rem">
          <a href="/about" style="color: #2e7d32; font-weight: bold; margin-right: 1rem"
            >About MonthExpense</a

            >Privacy Policy</a
          >

        </nav>
      </div>
